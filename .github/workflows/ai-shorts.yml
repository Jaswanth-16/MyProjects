name: AI Shorts - review build
on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-shorts-automation/**'
      - '.github/workflows/ai-shorts.yml'
jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-shorts-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Build review Short
        run: python pipeline.py --voice offline
      - name: Verify MP4
        run: |
          test -s output/short.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 output/short.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: ai-short-review
          path: ai-shorts-automation/output/short.mp4
          retention-days: 7
