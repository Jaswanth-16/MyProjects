name: CaseLake Spark Delta and AI
on:
  push:
    paths: ['caselake/**', '.github/workflows/caselake-ci.yml']
  pull_request:
    paths: ['caselake/**', '.github/workflows/caselake-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: caselake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: caselake/requirements-local.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r requirements-local.txt
      - run: python -m pytest tests -q --junitxml=test-results.xml
      - run: python -m caselake.local_demo --workspace demo-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caselake-verification
          path: |
            caselake/test-results.xml
            caselake/demo-output/report.json
