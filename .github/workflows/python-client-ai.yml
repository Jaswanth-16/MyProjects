name: Python Client Analytics and Evidence AI
on:
  push:
    paths: ['clientpulse/**', 'evidencebrief/**', '.github/workflows/python-client-ai.yml']
  pull_request:
    paths: ['clientpulse/**', 'evidencebrief/**', '.github/workflows/python-client-ai.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            clientpulse/requirements.txt
            evidencebrief/requirements.txt
      - run: pip install -r clientpulse/requirements.txt -r evidencebrief/requirements.txt
      - run: python -m pytest clientpulse/tests evidencebrief/tests -q --junitxml=python-client-tests.xml
      - name: Run ClientPulse report
        working-directory: clientpulse
        run: |
          python -m clientpulse sample --output demo-data
          python -m clientpulse analyse --input demo-data --output demo-output
      - name: Run EvidenceBrief regression and CLI
        working-directory: evidencebrief
        run: |
          python scripts/evaluate.py --output demo-output/evaluation.json
          python -m evidencebrief --question "Who approves retention interventions?" --output demo-output/answer.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-client-ai-evidence
          path: |
            python-client-tests.xml
            clientpulse/demo-output/
            evidencebrief/demo-output/
