name: SentinelForge Security Checks
on:
  push:
    paths:
      - "SentinelForge-AI/**"
      - ".github/workflows/sentinelforge-security.yml"
  pull_request:
    paths:
      - "SentinelForge-AI/**"
      - ".github/workflows/sentinelforge-security.yml"
permissions:
  contents: read
jobs:
  static-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SentinelForge-AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and audit Python dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=84.1.0'
          python -m pip install -e ".[dev,postgres]" pip-audit
          pip-audit
      - name: Ruff static checks
        run: |
          ruff check sentinelforge tests --select E4,E7,E9,F63,F7,F82
      - name: Unit tests
        run: pytest -q
