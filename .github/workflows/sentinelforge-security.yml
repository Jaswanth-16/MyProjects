name: SentinelForge Security Checks
on:
  push:
    paths:
      - "SentinelForge-AI/**"
      - ".github/workflows/sentinelforge-security.yml"
  pull_request:
    paths:
      - "SentinelForge-AI/**"
      - ".github/workflows/sentinelforge-security.yml"
permissions:
  contents: read
jobs:
  static-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelforge_test
          POSTGRES_USER: sentinelforge
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinelforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SENTINELFORGE_TEST_DATABASE_URL: postgresql://sentinelforge:test-only-password@localhost:5432/sentinelforge_test
    defaults:
      run:
        working-directory: SentinelForge-AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and audit Python dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=84.1.0'
          python -m pip install -e ".[dev,postgres]" pip-audit
          pip-audit
      - name: Ruff static checks
        run: |
          ruff check sentinelforge tests --select E4,E7,E9,F63,F7,F82
      - name: Unit tests
        run: pytest -q
