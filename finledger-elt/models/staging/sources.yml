version: 2
sources:
  - name: finance_raw
    schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
    tables:
      - name: RAW_TRANSACTIONS
models:
  - name: stg_transactions
    columns:
      - name: transaction_id
        data_tests: [not_null, unique]
      - name: account_id
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['SETTLED', 'PENDING', 'REVERSED']
